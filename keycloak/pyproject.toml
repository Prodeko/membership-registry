[project]
name = "keycloak-setup"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff",
    "types-requests",
]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
