# Invite / account-update email sent by the admin API (execute-actions).
# {0} = action link, {2} = realm display name, {4} = link expiration
executeActionsSubject=Welcome to the Prodeko membership registry
executeActionsBody=An account has been created for you in {2}.\n\nActivate it by setting a password and verifying your email address via the link below:\n\n{0}\n\nThe link expires in {4}. If it has expired, use "Forgot password?" on the login page to get a new one.\n\nIf you were not expecting this message, you can ignore it.
executeActionsBodyHtml=<html><body><p>An account has been created for you in {2}.</p><p>Activate it by setting a password and verifying your email address:</p><p><a href="{0}">Activate your account</a></p><p>The link expires in {4}. If it has expired, use &quot;Forgot password?&quot; on the login page to get a new one.</p><p>If you were not expecting this message, you can ignore it.</p></body></html>

# Password reset email ("Forgot password?").
# {0} = reset link, {2} = realm display name, {3} = link expiration
passwordResetSubject=Prodeko membership registry: reset your password
passwordResetBody=Someone asked to reset the password for your {2} account.\n\nSet a new password using the link below:\n\n{0}\n\nThe link expires in {3}.\n\nIf you didn''t ask for this, you can ignore this email – your password stays the same.
passwordResetBodyHtml=<html><body><p>Someone asked to reset the password for your {2} account.</p><p><a href="{0}">Set a new password</a></p><p>The link expires in {3}.</p><p>If you didn''t ask for this, you can ignore this email – your password stays the same.</p></body></html>
