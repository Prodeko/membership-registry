# Invite / account-update email sent by the admin API (execute-actions).
# {0} = action link, {2} = realm display name, {4} = link expiration
executeActionsSubject=Tervetuloa Prodekon jäsenrekisteriin
executeActionsBody=Sinulle on luotu tili palveluun {2}.\n\nOta tili käyttöön asettamalla salasana ja vahvistamalla sähköpostiosoitteesi alla olevasta linkistä:\n\n{0}\n\nLinkki vanhenee: {4}. Jos linkki on vanhentunut, saat uuden kirjautumissivun "Unohtuiko salasana?" -toiminnolla.\n\nJos et odottanut tätä viestiä, voit jättää sen huomiotta.
executeActionsBodyHtml=<html><body><p>Sinulle on luotu tili palveluun {2}.</p><p>Ota tili käyttöön asettamalla salasana ja vahvistamalla sähköpostiosoitteesi:</p><p><a href="{0}">Ota tili käyttöön</a></p><p>Linkki vanhenee: {4}. Jos linkki on vanhentunut, saat uuden kirjautumissivun &quot;Unohtuiko salasana?&quot; -toiminnolla.</p><p>Jos et odottanut tätä viestiä, voit jättää sen huomiotta.</p></body></html>
