[package]
name = "membership-registry"
version = "0.1.0"
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ammonia = "4"
async-stripe-webhook = { version = "1.0.0-rc.8", features = [
    "async-stripe-checkout",
] }
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["tokio", "macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
cookie = "0.18.1"
csv = "1.4.0"
dotenvy = "0.15"
envconfig = "0.11.1"
moka = { version = "0.12", features = ["future"] }
futures-util = "0.3.32"
http-body-util = "0.1.3"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
md-5 = "0.11"
oauth2 = "5.0.0"
percent-encoding = "2"
postgres = "0.19.13"
rand = "0.10.1"
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.20.0"
sqlx = { version = "0.9", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "chrono",
    "uuid",
    "tls-rustls",
] }
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
    "fs",
    "cors",
    "trace",
    "auth",
    "validate-request",
    "set-header",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23", features = ["serde", "v4"] }
validator = { version = "0.20", features = ["derive"] }
tower_governor = "0.8"
tokio-cron-scheduler = "0.15.1"
chrono-tz = "0.10.4"

[dev-dependencies]
mockall = "0.15"
wiremock = "0.6"
