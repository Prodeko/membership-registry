[package]
name = "membership-registry"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.80"
axum = { version = "0.7.2", features=["tokio", "macros"]}
axum-extra = { version = "0.9.3", features = ["cookie"] }
bytes = "1.6.1"
chrono = { version = "0.4.38", features=["serde"]}
clap = "4.5.4"
cookie = "0.18.1"
csv = "1.3.0"
dotenv = "0.15.0"
envconfig = "0.10.0"
fake = "2.9.2"
futures-util = "0.3.30"
http-body-util = "0.1.2"
oauth2 = "4.4.2"
ory-client = "1.9.0"
postgres = "0.19.7"
rand = "0.8.5"
reqwest = { version = "0.12.5", features = ["json"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.117"
serde_with = "3.4.0"
sqlx = { version = "0.7.3", features=["postgres", "runtime-tokio", "macros", "chrono", "uuid", "tls-rustls"]}
tokio = { version = "1.35.0", features = ["full"] }
tokio-util = { version = "0.7.11", features = ["io"]}
tower = "0.4.13"
tower-http = { version = "0.5.2", features = ["fs", "cors", "trace", "auth", "validate-request"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
validator = { version = "0.16.1", features = ["derive"]}
