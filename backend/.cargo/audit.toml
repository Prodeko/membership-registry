[advisories]
# RUSTSEC-2023-0071: Marvin Attack on `rsa` crate (no fix available).
# The `rsa` crate is only reachable via:
#   1. sqlx-mysql — pulled transitively by sqlx-macros-core even though this
#      project uses only Postgres. Code paths are unreachable at runtime.
#   2. jsonwebtoken when built with the `rust_crypto` backend — we use the
#      `aws_lc_rs` backend instead, so this path is also unreachable.
# Revisit when upstream crates (sqlx, rsa) publish a fixed version.
ignore = ["RUSTSEC-2023-0071"]
