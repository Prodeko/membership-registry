name: CI

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://membership:secret@localhost:5433/membership?sslmode=disable
  TEST_DATABASE_URL: postgres://membership:secret@localhost:5433/membership?sslmode=disable

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run lint
      - run: pnpm exec prettier --check .
      - run: pnpm run build

  e2e:
    name: E2E checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: membership
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: membership
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo install sqlx-cli --no-default-features --features postgres
      - run: sqlx migrate run
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo sqlx prepare --check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Advisories below are dead code paths in this binary. async-stripe 0.41
      # is used only for `Webhook::construct_event` (HMAC-SHA256 verification);
      # no outbound TLS is opened, so its bundled rustls 0.21 / hyper-rustls
      # 0.24 / http-types stack never executes. The `rand` 0.7/0.8 unsoundness
      # only triggers via a custom logger calling `rand::rng()` from drop, which
      # we do not install. Re-evaluate when async-stripe is upgraded or dropped.
      - name: cargo audit
        working-directory: backend
        if: always()
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2026-0097
      - run: pnpm audit --audit-level high
        working-directory: frontend
        if: always()
      - run: pnpm audit --audit-level high
        working-directory: e2e
        if: always()

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
