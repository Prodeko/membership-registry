name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: prodekoregistry
  ACR_LOGIN_SERVER: prodekoregistry.azurecr.io
  IMAGE_NAME: membership-registry
  APP_NAME: prodeko-membership-registry
  RESOURCE_GROUP: prodeko-rg

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Build and deploy
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push
        run: |
          TAG="${{ github.sha }}"
          docker build -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$TAG" -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" .
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$TAG"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      - name: Restart App Service
        run: az webapp restart --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
